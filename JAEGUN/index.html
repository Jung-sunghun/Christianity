<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재건총회 자료실 (JAEGUN)</title>
<meta name="description" content="대한예수교 장로회 재건총회 자료실. 재건총회 관련 자료를 모아 두는 곳입니다.">
<style>
:root{
  --navy:#162d47; --navy3:#24466c;
  --ink:#0f172a; --muted:#46586d; --bg:#f6f8fb; --paper:#fff;
  --line:#d5dfe9; --accent:#8c2434;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  font-size:17px;line-height:1.8;word-break:keep-all;overflow-wrap:break-word}
h1,p{margin:0;padding:0}
a{color:var(--navy3);text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{background:var(--navy);color:#fff;padding:44px 0 38px;border-bottom:4px solid var(--accent)}
header .kicker{display:inline-block;font-size:.8em;letter-spacing:.14em;color:#b9cde3;font-weight:700}
header h1{margin-top:12px;font-size:1.9em;line-height:1.35;letter-spacing:-.03em;font-weight:800;color:#fff}
main{padding:40px 0 8px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:34px 26px;
  text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.05),0 10px 26px rgba(15,23,42,.07)}
.box .mark{display:inline-block;width:56px;height:56px;line-height:56px;border-radius:50%;
  background:#fbeef0;color:var(--accent);font-size:1.5em;font-weight:800}
.box h2{margin:16px 0 0;font-size:1.35em;color:var(--navy);letter-spacing:-.02em}
.box p{margin-top:10px;color:var(--muted);font-size:1em}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:30px;padding:13px 18px;
  background:#eff3f8;border:1px solid #dde7f1;border-radius:12px;font-size:.95em;font-weight:700;color:var(--navy3)}
.back:hover{background:#e5edf6}
footer{margin-top:36px;padding:26px 0 44px;border-top:1px solid var(--line);color:var(--muted);font-size:.86em;line-height:1.9}
footer b{color:var(--navy3)}
@media (max-width:520px){
  body{font-size:16px}
  header{padding:34px 0 30px}
  header h1{font-size:1.5em}
  .box{padding:28px 18px}
  .wrap{padding:0 16px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="kicker">대한예수교 장로회 재건총회</span>
    <h1>재건총회 자료실 (JAEGUN)</h1>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="box">
      <span class="mark">JAEGUN</span>
      <h2>자료 준비 중입니다.</h2>
      <p>재건총회 관련 자료를 정리하여 이 자리에 차례로 올리겠습니다.</p>
    </div>

    <a class="back" href="../">&larr; 정성헌 목사 신학 아카이브 첫 화면으로</a>
  </div>
</main>

<footer>
  <div class="wrap">
    <b>대한예수교 장로회 재건총회</b> · 대구선교교회<br>
    만든이 정성헌 목사 · 문의 <a href="mailto:c56612@daum.net">c56612@daum.net</a>
  </div>
</footer>

</body>
</html>
